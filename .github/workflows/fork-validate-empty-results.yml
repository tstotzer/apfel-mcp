name: Fork-only empty-results validation

on:
  push:
    branches: [ci/validate-empty-results-20261025]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'tstotzer/apfel-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: base
            ref: 8c6977f47c0641dc3ed9882ecee814b3749c87ad
            python: '3.12'
          - revision: fixed
            ref: dcc0e5593e6052fb5a4463c73c8737c55ccd3509
            python: '3.10'
          - revision: fixed
            ref: dcc0e5593e6052fb5a4463c73c8737c55ccd3509
            python: '3.11'
          - revision: fixed
            ref: dcc0e5593e6052fb5a4463c73c8737c55ccd3509
            python: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint all source and tests
        run: python -m ruff check src tests
      - name: Run entire unmodified test selection
        run: python -m pytest -v
