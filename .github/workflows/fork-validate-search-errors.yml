name: Fork-only search error budget validation

on:
  push:
    branches: [ci/validate-search-errors-20261116]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'tstotzer/apfel-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: base
            ref: 548c19a12651415da1e33a5bcbe8516bd0cacb49
            python: '3.12'
          - revision: fixed
            ref: 0e4b1b2c5e8e4206e63889bd5f8a77fa5107afbe
            python: '3.10'
          - revision: fixed
            ref: 0e4b1b2c5e8e4206e63889bd5f8a77fa5107afbe
            python: '3.11'
          - revision: fixed
            ref: 0e4b1b2c5e8e4206e63889bd5f8a77fa5107afbe
            python: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify imported source
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import apfel_mcp
          print(sys.executable, apfel_mcp.__file__)
          assert Path(apfel_mcp.__file__).resolve().is_relative_to(Path.cwd() / 'src')
          PY
      - name: Lint all source and tests
        run: python -m ruff check src tests
      - name: Run entire unmodified test selection
        run: python -m pytest -v
      - name: Obtain candidate regression tests for the base comparison
        if: matrix.revision == 'base'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0e4b1b2c5e8e4206e63889bd5f8a77fa5107afbe
          path: .candidate-proof
          persist-credentials: false
      - name: Prove intended regressions fail on unchanged base source
        if: matrix.revision == 'base'
        run: |
          cp .candidate-proof/tests/test_search_and_fetch_server.py tests/test_search_and_fetch_server.py
          set +e
          python -m pytest tests/test_search_and_fetch_server.py -q -k 'handled_exception_output or all_fetches_fail_with_long_query or stdio_exception_result' --junitxml=base-regression.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('base-regression.xml').getroot().findall('.//testsuite')
          totals = {key: sum(int(s.attrib.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(totals)
          assert totals == {'tests': 23, 'failures': 15, 'errors': 0, 'skipped': 0}
          PY
